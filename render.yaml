services:
  - type: web
    name: tailquickie
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: tailscale-state
      mountPath: /var/lib/tailscale
      sizeGB: 1
    envVars:
      - key: TS_HOSTNAME
        value: tailquickie
